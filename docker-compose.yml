version: "3.8"

services:
  app:
    build: .
    container_name: pos-app
    restart: unless-stopped
    working_dir: /var/www
    depends_on:
      - mysql
    networks:
      - pos-network
    volumes:
      - ./.env.docker:/var/www/.env 
    ports:
      - "8003:80"
      
  nginx:
    image: nginx:alpine
    container_name: pos-nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pos-network

  mysql:
    image: mysql:8.0
    container_name: pos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laundry_db
      MYSQL_ROOT_PASSWORD: roots
      MYSQL_PASSWORD: roots
      MYSQL_USER: roots
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pos-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pos-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - pos-network

volumes:
  mysql_data:

networks:
  pos-network:
    driver: bridge