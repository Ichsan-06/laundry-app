version: "3.8"

services:
  app:
    build: .
    container_name: laundry-app
    restart: unless-stopped
    working_dir: /var/www
    networks:
      - laundry-network
    volumes:
      - ./.env.docker:/var/www/.env 
    ports:
      - "8003:80"
      
  nginx:
    image: nginx:alpine
    container_name: laundry-nginx
    restart: unless-stopped
    ports:
      - "8006:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laundry-network

networks:
  laundry-network:
    driver: bridge

  shared-infra:
    external: true