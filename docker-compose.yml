version: "3.8"

services:
  app:
    image: ichsan06/washkita-app:latest
    container_name: laundry-app
    restart: unless-stopped
    working_dir: /var/www
    depends_on:
      - mysql
    networks:
      - laundry-network
    volumes:
      - ./.env.docker:/var/www/.env
    expose:
      - "9000"   # kalau pakai php-fpm (opsional)

  nginx:
    image: nginx:alpine
    container_name: laundry-nginx
    restart: unless-stopped
    ports:
      - "8006:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laundry-network

  mysql:
    image: mysql:8.0
    container_name: laundry-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laundry_db
      MYSQL_ROOT_PASSWORD: roots
      MYSQL_USER: roots
      MYSQL_PASSWORD: roots
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laundry-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laundry-phpmyadmin
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: roots
    depends_on:
      - mysql
    networks:
      - laundry-network

volumes:
  mysql_data:

networks:
  laundry-network:
    driver: bridge