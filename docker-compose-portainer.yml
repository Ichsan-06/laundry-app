
version: "3.8"

services:
  app:
    build: .
    image: laundry-app:latest
    image_build:
      context: .
      dockerfile: Dockerfile
    container_name: laundry-app
    restart: unless-stopped
    working_dir: /var/www
    networks:
      - laundry-network
    volumes:
      - /opt/laundry-app/.env:/var/www/.env:ro
    ports:
      - "8003:80"

  nginx:
    image: nginx:alpine
    container_name: laundry-nginx
    restart: unless-stopped
    ports:
      - "8006:80"
    volumes:
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: .
        target: /var/www
        read_only: true
    depends_on:
      - app
    networks:
      - laundry-network

networks:
  laundry-network:
    driver: bridge
